device: 'cuda'
gpu_id: 0

lr: 0.0001
momentum: 0.9
weight_decay: 0.0005
dropout_rate: 0.7
seed: 1

use_wandb: false
wandb_project: 'vad'
wandb_entity:
wandb_run_name:
wandb_group:
wandb_tags: []

use_pruning: false
prune_magnitude_ratio: 0.05
prune_random_ratio: 0.05
use_early_unprune: false
unprune_ratio: 0.3
prune_random_seed:

epochs: 100
batch_size: 8
test_freq: 1
segment_len: 16
process_len: 32
feature_dim: 2048

r: 0.4
h: 0.1

sample_type: 'uniform'

logger_path: './logger'
ckpt_path: './ckpts'
pretrained_path:

dataset: 'tudat'
feature_path: './data/TU-DAT/features'
frames_root: './data/TU-DAT/frames'
# 클래스 매핑 (필요에 따라 수정)
# 정상: Negative_Videos만, 나머지(challenging-environment 포함)는 이상
normal_classes: ['Negative_Videos']
abnormal_classes: ['Positive_Vidoes', 'Rash-Driving', 'challenging-environment']

# 분할 파일 (없으면 전체 스캔)
training_split: './data/TU-DAT/train_split.txt'
testing_split: './data/TU-DAT/test_split.txt'
np_scores_path:
feature_name_end: '_res.npy'

th_auc: 0.5
th_pr: 0.25
