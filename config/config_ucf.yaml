device: 'cuda'
gpu_id: 0

lr: 0.0001
momentum: 0.9
weight_decay: 0.0005
dropout_rate: 0.7
seed: 1

use_wandb: false
wandb_project: 'vad'
wandb_entity:
wandb_run_name:
wandb_group:
wandb_tags: []

use_pruning: false
prune_magnitude_ratio: 0.05
prune_random_ratio: 0.05
use_early_unprune: false
unprune_ratio: 0.3
prune_random_seed:

epochs: 200
batch_size: 16
test_freq: 1
segment_len: 16
process_len: 64
feature_dim: 2048

r: 0.3   # abnormal ratio (UCF-Crime default)
h: 0.2   # high-confidence normal videos ratio

sample_type: 'uniform'

logger_path: './logger'
ckpt_path: './ckpts/ucf_crime'
pretrained_path:

dataset: 'ucf-crime'
feature_path: './data/ucf-crime/features'
anno_path: './data/ucf-crime/Temporal_Anomaly_Annotation_New.txt'
training_split: './data/ucf-crime/Anomaly_Train.txt'
testing_split: './data/ucf-crime/Anomaly_Test.txt'
np_scores_path: './data/ucf-crime/pseudo_label_scores_ucf.npy'
feature_name_end: '_res.npy'

th_auc: 0.75
th_pr: 0.5
